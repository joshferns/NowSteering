name: Build probe APK

on:
  push:
    paths:
      - "app/**"
      - "gradle/**"
      - "*.gradle.kts"
      - ".github/workflows/probe-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk NowSteering-probe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NowSteering-probe
          path: NowSteering-probe.apk

      # Each build is its own release; "latest" always points at the newest one, so the
      # phone link .../releases/latest/download/NowSteering-probe.apk never changes.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: probe-${{ github.run_number }}
          name: Probe build ${{ github.run_number }} (${{ github.ref_name }})
          target_commitish: ${{ github.sha }}
          body: |
            Phase 0 probe debug APK, commit ${{ github.sha }} on ${{ github.ref_name }}.
            Install over the previous build (same signing key).
          files: NowSteering-probe.apk
          make_latest: true
